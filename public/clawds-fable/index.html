const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a, b) => a + Math.random() * (b - a);
const rndi = (a, b) => Math.floor(rnd(a, b + 1));
function mulberry(seed) {
  let t = seed >>> 0;
  return function () {
    t = (t + 0x6D2B79F5) >>> 0;
    let r = Math.imul(t ^ (t >>> 15), 1 | t);
    r ^= r + Math.imul(r ^ (r >>> 7), 61 | r);
    return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
  };
}
// pick from a list without repeating the previous pick for that list
const lastPick = new Map();
function pick(arr, key) {
  key = key || arr;
  if (arr.length === 1) return arr[0];
  let v;
  do { v = arr[rndi(0, arr.length - 1)]; } while (v === lastPick.get(key));
  lastPick.set(key, v);
  return v;
}

}

function makeClawdFrame(legs, blink, tuck) {

    const lx = tuck ? LEG_X[i] + (i < 2 ? 1 : -1) : LEG_X[i];

const SFX = {
  ctx: null, master: null, muted: false, musicOn: true, nextNote: 0, noteIdx: 0,
  init() {
    if (this.ctx) return;

      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      this.master = this.ctx.createGain(); this.master.gain.value = this.muted ? 0 : 1;
      this.master.connect(this.ctx.destination);
      this.nextNote = this.ctx.currentTime + 0.1;
    } catch (e) { this.ctx = null; }
  },
  resume() { if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); },
  toggleMute() { this.muted = !this.muted; if (this.master) this.master.gain.value = this.muted ? 0 : 1; },
  tone(freq, dur, type = 'square', vol = 0.08, slideTo = null, when = 0) {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime + when;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t0 + dur);
    g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(this.master); o.start(t0); o.stop(t0 + dur + 0.02);
  },
  noise(dur, vol = 0.08, when = 0, lowpass = 1200) {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime + when, n = Math.floor(this.ctx.sampleRate * dur);
    const buf = this.ctx.createBuffer(1, n, this.ctx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const s = this.ctx.createBufferSource(); s.buffer = buf;
    const f = this.ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = lowpass;
    const g = this.ctx.createGain(); g.gain.value = vol;
    s.connect(f); f.connect(g); g.connect(this.master); s.start(t0);
  },
  jump() { this.tone(420, 0.12, 'square', 0.06, 760); },
  stomp(combo) { const base = 180 + combo * 90; this.tone(base, 0.16, 'sawtooth', 0.07, base * 2.6); this.noise(0.08, 0.05, 0, 900); },
  pop() { this.tone(900, 0.06, 'square', 0.05, 1400); },
  token() { this.tone(1180, 0.08, 'square', 0.05); this.tone(1760, 0.14, 'square', 0.05, null, 0.07); },
  hit() { this.tone(160, 0.28, 'sawtooth', 0.09, 60); this.noise(0.2, 0.06, 0, 500); },
  groan() { this.tone(95, 0.45, 'sawtooth', 0.025, 70); this.tone(140, 0.4, 'triangle', 0.02, 110); },
  cough() { this.noise(0.06, 0.03, 0, 2500); this.tone(300, 0.05, 'square', 0.02, 200); },
  bump() { this.tone(200, 0.08, 'square', 0.05, 150); },
  checkpoint() { [523, 659, 784, 1046].forEach((f, i) => this.tone(f, 0.12, 'square', 0.06, null, i * 0.08)); },
  goal() { [523, 659, 784, 659, 784, 1046, 1318].forEach((f, i) => this.tone(f, 0.18, 'square', 0.06, null, i * 0.11)); this.tone(1568, 0.6, 'triangle', 0.06, null, 0.8); },
  bossHurt() { this.tone(500, 0.3, 'sawtooth', 0.07, 120); this.noise(0.25, 0.06, 0, 1500); },
  // gentle looping chiptune, scheduled slightly ahead of time
  MELODY: [ [523, 1], [659, 1], [784, 2], [659, 1], [523, 1], [587, 2], [659, 1], [784, 1], [880, 2], [784, 1], [659, 1], [523, 2],
            [440, 1], [523, 1], [659, 2], [587, 1], [523, 1], [494, 2], [523, 1], [587, 1], [659, 2], [523, 2], [0, 2] ],
  BASS: [131, 131, 165, 165, 175, 175, 196, 196],
  tick() {
    if (!this.ctx || !this.musicOn) return;
    const step = 0.22;
    while (this.nextNote < this.ctx.currentTime + 0.3) {
      const [f, len] = this.MELODY[this.noteIdx % this.MELODY.length];
      const when = this.nextNote - this.ctx.currentTime;
      if (f > 0) this.tone(f, step * len * 0.9, 'triangle', 0.035, null, when);
      const b = this.BASS[Math.floor(this.noteIdx / 2) % this.BASS.length];
      this.tone(b, step * len * 0.8, 'square', 0.014, null, when);
      this.nextNote += step * len; this.noteIdx++;
    }
  },
};

// tile ids
const T = { EMPTY: 0, DIRT: 1, GRASS: 2, TODO: 3, DONE: 4, FIXME: 5, PLAT: 6, STONE: 7, WALL: 8 };
const SOLID = new Set([T.DIRT, T.GRASS, T.TODO, T.DONE, T.FIXME, T.PLAT, T.STONE, T.WALL]);
const level = { tiles: new Uint8Array(LEVEL_W * LEVEL_H), spawns: [], tokens: [], signs: [], flag: null, goal: null, start: null };
const tileAt = (cx, cy) => (cx < 0 || cx >= LEVEL_W || cy < 0 || cy >= LEVEL_H) ? (cx < 0 || cx >= LEVEL_W ? T.WALL : T.EMPTY) : level.tiles[cy * LEVEL_W + cx];
const setTile = (cx, cy, t) => { if (cx >= 0 && cx < LEVEL_W && cy >= 0 && cy < LEVEL_H) level.tiles[cy * LEVEL_W + cx] = t; };
function surfaceY(cx) { for (let cy = 0; cy < LEVEL_H; cy++) if (SOLID.has(tileAt(cx, cy))) return cy * TILE; return LEVEL_H * TILE; }

function buildLevel() {

  const pit = (x0, x1) => { for (let x = x0; x <= x1; x++) for (let y = 0; y < LEVEL_H; y++) setTile(x, y, T.EMPTY); };

  const sign = (cx, text) => level.signs.push({ x: cx * TILE, y: surfaceY(cx), text });

  for (let y = 0; y < LEVEL_H; y++) { setTile(0, y, T.WALL); setTile(LEVEL_W - 1, y, T.WALL); }

  tokens(109, 111, 10);

  tokens(119, 121, 12);
  // --- staircase up to the arena
  ground(133, 134, 13); ground(135, 136, 12); ground(137, 138, 11); ground(139, LEVEL_W - 1, 10);
  tokens(134, 134, 11); tokens(136, 136, 10); tokens(138, 138, 9);
  // --- boss arena

// ============================ PHYSICS ================================
function solidSpan(cxa, cxb, cya, cyb) {
  for (let cy = cya; cy <= cyb; cy++) for (let cx = cxa; cx <= cxb; cx++) if (SOLID.has(tileAt(cx, cy))) return { cx, cy, t: tileAt(cx, cy) };
  return null;
}
function moveBody(e, dt) {
  e.hitWall = false; e.bumped = null;
  const eps = 0.01;
  e.x += e.vx * dt;
  const cya = Math.floor(e.y / TILE), cyb = Math.floor((e.y + e.h - eps) / TILE);
  if (e.vx > 0) { const cx = Math.floor((e.x + e.w - eps) / TILE); if (solidSpan(cx, cx, cya, cyb)) { e.x = cx * TILE - e.w; e.vx = 0; e.hitWall = true; } }
  else if (e.vx < 0) { const cx = Math.floor(e.x / TILE); if (solidSpan(cx, cx, cya, cyb)) { e.x = (cx + 1) * TILE; e.vx = 0; e.hitWall = true; } }
  e.vy = Math.min(e.vy + PHYS.gravity * dt, 520);
  e.y += e.vy * dt; e.onGround = false;
  const cxa = Math.floor(e.x / TILE), cxb = Math.floor((e.x + e.w - eps) / TILE);
  if (e.vy > 0) { const cy = Math.floor((e.y + e.h - eps) / TILE); if (solidSpan(cxa, cxb, cy, cy)) { e.y = cy * TILE - e.h; e.vy = 0; e.onGround = true; } }
  else if (e.vy < 0) {

// ---- speech
function newPhrase(e) {

// ============================ UPDATE: PLAYER =========================
function updatePlayer(dt) {

// ============================ UPDATE: SLOP ===========================
function updateEnemy(e, dt) {

// ============================ UPDATE: WORLD ==========================
function updateWorld(dt) {

}

// ============================ SCREENS ================================
function text(str, x, y, px, color, align = 'center', bold = true) { sctx.font = FONT(px, bold); sctx.fillStyle = color; sctx.textAlign = align; sctx.textBaseline = 'middle'; sctx.fillText(str, x, y); }
function pagePanel(x, y, w, h) {
  sctx.fillStyle = PAL.ink; sctx.fillRect(x - 3 * SCALE, y - 3 * SCALE, w + 6 * SCALE, h + 6 * SCALE);
  sctx.fillStyle = PAL.orange; sctx.fillRect(x - 2 * SCALE, y - 2 * SCALE, w + 4 * SCALE, h + 4 * SCALE);
  sctx.fillStyle = PAL.paper; sctx.fillRect(x, y, w, h);
  sctx.fillStyle = PAL.creamDark; sctx.fillRect(x + 4 * SCALE, y + 4 * SCALE, w - 8 * SCALE, 1); sctx.fillRect(x + 4 * SCALE, y + h - 4 * SCALE, w - 8 * SCALE, 1);
}
const blink = (rate = 1.6) => Math.floor(G.time * rate) % 2 === 0;
function drawTitle() {
  const W = VW * SCALE, cx = OFFX + W / 2, px = OFFX + 50 * SCALE, py = OFFY + 22 * SCALE, pw = W - 100 * SCALE, ph = 148 * SCALE;
  pagePanel(px, py, pw, ph);
  text("Clawd's Fable", cx, py + 40 * SCALE, Math.round(22 * SCALE), PAL.orange);
  text("a small tale of defeating the slop", cx, py + 62 * SCALE, Math.round(7 * SCALE), PAL.ink2, 'center', false);
  const img = G.player.blink > 0 ? SPR.idleBlink : SPR.idle;
  sctx.drawImage(img, cx - 24 * SCALE, py + 78 * SCALE, 48 * SCALE, 48 * SCALE);
  if (blink()) text("press Enter to begin", cx, py + ph - 14 * SCALE, Math.round(7 * SCALE), PAL.ink);
  text("arrows run - space jumps - p pauses - m mutes", cx, OFFY + VH * SCALE - 8 * SCALE, Math.round(5 * SCALE), PAL.ink, 'center', false);
}
function drawIntro() {
  const W = VW * SCALE, H = VH * SCALE, cx = OFFX + W / 2;
  pagePanel(OFFX + 30 * SCALE, OFFY + 30 * SCALE, W - 60 * SCALE, H - 60 * SCALE);
  INTRO_LINES.forEach((ln, i) => { if (G.introT > 0.3 + i * 1.1) text(ln, cx, OFFY + (85 + i * 30) * SCALE, Math.round(8 * SCALE), PAL.ink, 'center', false); });
  if (G.introT > 3.6 && blink()) text("press Enter", cx, OFFY + H - 52 * SCALE, Math.round(7 * SCALE), PAL.orange);
}
function drawPause() {
  const W = VW * SCALE, H = VH * SCALE, cx = OFFX + W / 2, cy = OFFY + H / 2;
  sctx.fillStyle = 'rgba(31,27,58,0.7)'; sctx.fillRect(OFFX, OFFY, W, H);
  const n = 8, k = Math.floor(G.stateT * 10) % n;
  for (let i = 0; i < n; i++) { const a = i / n * Math.PI * 2; sctx.fillStyle = i === k ? PAL.orange : i === (k + n - 1) % n ? PAL.orangeLight : PAL.ink3; sctx.fillRect(Math.round(cx + Math.cos(a) * 14 * SCALE) - 2 * SCALE, Math.round(cy - 30 * SCALE + Math.sin(a) * 14 * SCALE) - 2 * SCALE, 4 * SCALE, 4 * SCALE); }
  text("thinking...", cx, cy + 2 * SCALE, Math.round(12 * SCALE), PAL.cream);
  text(G.pauseStatus, cx, cy + 20 * SCALE, Math.round(6 * SCALE), PAL.creamDark, 'center', false);
  text("press P to resume", cx, cy + 44 * SCALE, Math.round(5 * SCALE), PAL.slopGrey, 'center', false);
}
function drawGameOver() {
  const W = VW * SCALE, H = VH * SCALE, cx = OFFX + W / 2, cy = OFFY + H / 2;
  sctx.fillStyle = 'rgba(31,27,58,0.82)'; sctx.fillRect(OFFX, OFFY, W, H);
  text("rate limit reached.", cx, cy - 16 * SCALE, Math.round(16 * SCALE), PAL.orange);
  text("try again in 0s", cx, cy + 8 * SCALE, Math.round(7 * SCALE), PAL.cream, 'center', false);
  if (blink()) text("press enter", cx, cy + 30 * SCALE, Math.round(7 * SCALE), PAL.white);
}
function drawClear() {
  const W = VW * SCALE, H = VH * SCALE, cx = OFFX + W / 2;
  const t = G.clearT;
  if (t < 1.8) { // iris out
    const k = clamp((t - 0.6) / 1.1, 0, 1), rad = (1 - k) * Math.hypot(W, H) * 0.55;
    const p = G.player, fx = sx(p.x + p.w / 2), fy = sy(p.y + p.h / 2);
    sctx.fillStyle = PAL.ink; sctx.beginPath(); sctx.rect(0, 0, screen.width, screen.height); sctx.arc(fx, fy, Math.max(0, rad), 0, Math.PI * 2, true); sctx.fill();
    return;
  }
  sctx.fillStyle = PAL.ink; sctx.fillRect(0, 0, screen.width, screen.height);
  pagePanel(OFFX + 30 * SCALE, OFFY + 16 * SCALE, W - 60 * SCALE, H - 32 * SCALE);
  const fs = Math.round(6.5 * SCALE), lx = OFFX + 70 * SCALE, rx = OFFX + W - 70 * SCALE;
  const rows = [
    ["slop stomped", G.stomps + '  (+' + G.stompPts + ')'],
    ["tokens spent wisely", G.tokens + '  (+' + G.tokenPts + ')'],
    ["the great question", G.bossDead ? '+' + G.bossPts : 'skipped'],
    ["time saved", (G.timeBonus / 10) + 's  (+' + G.timeBonus + ')'],
  ];
  const shown = Math.floor((t - 1.8) / 0.45);
  text("Clawd's Fable", cx, OFFY + 34 * SCALE, Math.round(9 * SCALE), PAL.orange);
  rows.forEach((r, i) => { if (i < shown) { text(r[0], lx, OFFY + (58 + i * 16) * SCALE, fs, PAL.ink2, 'left', false); text(r[1], rx, OFFY + (58 + i * 16) * SCALE, fs, PAL.ink, 'right'); } });
  if (shown > rows.length) { sctx.fillStyle = PAL.ink2; sctx.fillRect(lx, OFFY + 124 * SCALE, rx - lx, Math.max(1, SCALE / 2)); text("total", lx, OFFY + 134 * SCALE, fs, PAL.ink2, 'left', false); text(String(G.score), rx, OFFY + 134 * SCALE, Math.round(8 * SCALE), PAL.orange, 'right'); }
  if (shown > rows.length + 1) { text("The End.", cx, OFFY + 172 * SCALE, Math.round(18 * SCALE), PAL.ink); text("(no notes.)", cx, OFFY + 192 * SCALE, Math.round(6 * SCALE), PAL.ink2, 'center', false); }
  if (shown > rows.length + 2 && blink()) text("press Enter to play again", cx, OFFY + 232 * SCALE, Math.round(6.5 * SCALE), PAL.orange);
}

function render() {
  sctx.fillStyle = PAL.ink; sctx.fillRect(0, 0, screen.width, screen.height);
  drawBackground(); drawTiles(); drawProps(); drawParticles(G.particles);
  if (G.state === 'title') drawBlob(G.titleBlob); else for (const e of G.enemies) drawBlob(e);
  drawProjectiles();
  if (!(G.state === 'clear' && G.clearT >= 0.7)) drawPlayer();
  drawParticles(G.particlesFront);
  sctx.drawImage(world, OFFX, OFFY, VW * SCALE, VH * SCALE);
  const pageUp = G.state === 'intro' || (G.state === 'clear' && G.clearT >= 1.8);
  if (!pageUp) { sctx.save(); sctx.beginPath(); sctx.rect(OFFX, OFFY, VW * SCALE, VH * SCALE); sctx.clip(); drawWorldLabels(); drawBubbles(); drawPopups(); sctx.restore(); }
  if (G.state === 'play' || G.state === 'pause' || G.state === 'gameover' || (G.state === 'clear' && G.clearT < 1.8)) drawHUD();
  if (G.state === 'title') drawTitle();
  else if (G.state === 'intro') drawIntro();
  else if (G.state === 'pause') drawPause();
  else if (G.state === 'gameover') drawGameOver();
  else if (G.state === 'clear') drawClear();
}

// ============================ GAME STATES & INPUT ====================
function enterTitle() {
  resetRun(); G.state = 'title'; G.camX = 0;
  G.player.x = 48; G.player.y = 14 * TILE - G.player.h;
  G.titleBlob = makeEnemy('shambler', 420, 14 * TILE, -1); G.titleBlob.speed = 20;
}
function onEnter() {
  if (G.state === 'title') { G.state = 'intro'; G.introT = 0; }
  else if (G.state === 'intro') { resetRun(); G.state = 'play'; }
  else if (G.state === 'gameover') { G.score = 0; G.stompPts = 0; G.tokenPts = 0; G.bossPts = 0; G.stomps = 0; G.lives = 3; G.state = 'play'; respawn(); }
  else if (G.state === 'clear' && G.clearT > 4.5) enterTitle();
}
window.addEventListener('keydown', ev => {
  if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space'].includes(ev.code)) ev.preventDefault();
  if (!SFX.ctx) SFX.init(); SFX.resume();
  keys[ev.code] = true; G.idleT = 0;
  if (ev.repeat) return;
  if (ev.code === 'Enter') onEnter();
  else if (ev.code === 'KeyM') SFX.toggleMute();
  else if (ev.code === 'KeyP' || ev.code === 'Escape') {
    if (G.state === 'play') { G.state = 'pause'; G.stateT = 0; G.pauseStatus = pick(PAUSE_STATUS); }
    else if (G.state === 'pause') G.state = 'play';
  }
  else if ((ev.code === 'Space' || ev.code === 'ArrowUp' || ev.code === 'KeyW') && G.state === 'play') G.player.jumpBuf = PHYS.buffer;
});
window.addEventListener('keyup', ev => { keys[ev.code] = false; });
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; if (G.state === 'play') { G.state = 'pause'; G.stateT = 0; G.pauseStatus = pick(PAUSE_STATUS); } });

// ============================ MAIN LOOP ==============================
function step(dt) {
  switch (G.state) {
    case 'play': updateWorld(dt); break;
    case 'title': updateTitle(dt); break;
    case 'intro': G.time += dt; G.introT += dt; break;
    case 'clear': updateClear(dt); break;
    case 'pause': case 'gameover': G.time += dt; G.stateT += dt; break;
  }
}
let last = performance.now(), acc = 0;
function frame(now) {
  let dt = (now - last) / 1000; last = now;
  if (dt > 0.1) dt = 0.1;
  acc += dt;
  while (acc >= DT) { step(DT); acc -= DT; }
  SFX.tick();
  render();
  requestAnimationFrame(frame);
}
enterTitle();
requestAnimationFrame(frame);
</script>
</body>
</html>
