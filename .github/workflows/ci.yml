name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # Fired by the garlic/shuck release workflows so project pages pick up the
  # new version (they fetch the latest release tag at build time).
  repository_dispatch:
    types: [release-published]
  # Daily safety net in case a dispatch is ever missed.
  schedule:
    - cron: '23 5 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Type-check, build, and upload static site
        uses: withastro/action@e84f40bd8d2caa9e768ec82ad30dd81f0b280853 # v6.1.2
        env:
          # Authenticates the build-time latest-release lookups (rate limits).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          build-cmd: bun astro check && bun run build

  deploy:
    needs: build
    # Deploy on anything that builds main: pushes, release dispatches from the
    # tool repos, the daily schedule, and manual runs.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 #v5.0.0
